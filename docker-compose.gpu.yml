# ─────────────────────────────────────────────────────────────────────────────
# Single-GPU L40S (48 GB) stack — everything local, no Ollama by default.
#
#   vllm-ocr  GLM-OCR 0.9B (original weights, MTP)     ~0.14 of GPU  (~6.5 GB)
#   vllm      Qwen3-VL-8B-Instruct-FP8 (generation)    ~0.50 of GPU  (~23 GB)
#   app       Qwen3-VL embed 2B + rerank 2B + layout   ~12-14 GB (PyTorch)
#   headroom                                           ~3-4 GB
#
# Start (local LLM):
#   COMPOSE_PROFILES=local-llm docker compose -f docker-compose.gpu.yml up -d
# Start order is enforced by healthchecks: vllm-ocr -> vllm -> app.
# Two vLLM engines profiling free GPU memory at the same time can over-commit,
# so they must not start in parallel.
# ─────────────────────────────────────────────────────────────────────────────

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

x-vllm-healthcheck: &vllm-healthcheck
  interval: 15s
  timeout: 10s
  retries: 20
  start_period: 600s   # first start downloads weights + captures CUDA graphs

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - EMBEDDING_PROVIDER=qwen
      - RERANKER_BACKEND=qwen
      - QWEN_EMBEDDING_MODEL=Qwen/Qwen3-VL-Embedding-2B
      - EMBEDDING_DIMENSIONS=2048
      - PARSER_BACKEND=ollama        # "ollama" = self-hosted GLM-OCR (served by vLLM here)
      # Models live in-process: >1 worker loads a second copy of embedder/reranker/layout into VRAM.
      - API_WORKERS=1
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./config.yaml:/app/config.yaml:ro
      - ./ollama/config.vllm.yaml:/app/ollama/config.yaml:ro   # GLM-OCR via vLLM
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_started
      vllm-ocr:
        condition: service_healthy
      vllm:
        condition: service_healthy
        required: false
      vllm-4bit:
        condition: service_healthy
        required: false
      ollama:
        condition: service_healthy
        required: false
    <<: *gpu

  qdrant:
    image: qdrant/qdrant:v1.17.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  # ── GLM-OCR on vLLM (replaces Ollama GGUF, which loops on most regions) ────
  vllm-ocr:
    build:
      context: .
      dockerfile: Dockerfile.vllm
    image: multimodal-rag/vllm:0.19.0
    ipc: host
    ports:
      - "127.0.0.1:8080:8080"        # host-local only, for debugging
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    command: >
      --model zai-org/GLM-OCR
      --served-model-name glm-ocr
      --port 8080
      --speculative-config '{"method": "mtp", "num_speculative_tokens": 3}'
      --gpu-memory-utilization 0.14
      --max-model-len 16384
      --max-num-seqs 128
      --max-num-batched-tokens 16384
    healthcheck:
      <<: *vllm-healthcheck
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
    <<: *gpu

  # ── Qwen3-VL-8B FP8 for generation / table captions ───────────────────────
  vllm:
    build:
      context: .
      dockerfile: Dockerfile.vllm
    image: multimodal-rag/vllm:0.19.0   # same image as vllm-ocr
    profiles:
      - local-llm
    ipc: host
    ports:
      - "8001:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    # FP8 weights (~10 GB) use the L40S's native FP8 tensor cores and leave
    # ~60% more VRAM for KV cache than BF16 -> more concurrent users.
    # limit-mm-per-prompt image=6 must be >= RERANKER_TOP_N (generate.py sends
    # one image block per retrieved image/table chunk).
    command: >
      --model Qwen/Qwen3-VL-8B-Instruct-FP8
      --served-model-name qwen3-vl-8b
      --port 8000
      --api-key ${VLLM_API_KEY:-local-token}
      --gpu-memory-utilization 0.50
      --max-model-len 16384
      --max-num-seqs 32
      --max-num-batched-tokens 8192
      --enable-prefix-caching
      --limit-mm-per-prompt '{"image": 6, "video": 0}'
    healthcheck:
      <<: *vllm-healthcheck
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
    depends_on:
      vllm-ocr:
        condition: service_healthy
    <<: *gpu

  # ── L4 (24 GB) fallback — unchanged ────────────────────────────────────────
  vllm-4bit:
    image: vllm/vllm-openai:latest
    profiles:
      - local-llm-4bit
    ports:
      - "8001:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    command: >
      --model Qwen/Qwen3-VL-8B-Instruct-AWQ
      --quantization awq
      --port 8000
      --dtype bfloat16
      --gpu-memory-utilization 0.40
      --max-model-len 32768
      --mm-encoder-tp-mode data
      --limit-mm-per-prompt image=10
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 240s
    <<: *gpu

  # ── Legacy GLM-OCR via Ollama (opt-in: COMPOSE_PROFILES=ollama) ────────────
  # Only used if you point the app back at ollama/config.docker.yaml.
  ollama:
    image: ollama/ollama:latest
    profiles:
      - ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_CONTEXT_LENGTH=16384
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    <<: *gpu

  visualizer:
    build:
      context: .
      dockerfile: Dockerfile.visualizer
    ports:
      - "8501:8501"
    volumes:
      - ./ollama/output:/app/ollama/output

volumes:
  qdrant_data:
  ollama_models:
  huggingface_cache:
